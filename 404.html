<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>A Little Teddy for You 🧸 | With Love & Sincere Apologies</title>
    <meta name="description" content="A cute, heartwarming, interactive teddy bear apology and friendship website crafted to bring a smile to your face." />
    <meta name="theme-color" content="#FFD6E7" />
    
    <!-- Open Graph tags for sharing -->
    <meta property="og:title" content="A Little Teddy for You 🧸" />
    <meta property="og:description" content="A special little adventure with teddy bears, apologies, and love for my favorite person." />
    <meta property="og:type" content="website" />
    
    <!-- Google Fonts: Fredoka & Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Production fallback for GitHub Pages when deploying from main branch -->
    <script>
      (function() {
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!isLocal && !document.querySelector('script[src*="assets/app.js"]')) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './assets/index.css';
          document.head.appendChild(link);

          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = './assets/app.js';
          document.body.appendChild(s);
        }
      })();
    </script>
  </body>
</html>
