<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bearGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#C89D7C"/>
      <stop offset="100%" stop-color="#8D5537"/>
    </radialGradient>
    <radialGradient id="earInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD6E7"/>
      <stop offset="100%" stop-color="#FFB3D1"/>
    </radialGradient>
  </defs>
  <!-- Left Ear -->
  <circle cx="16" cy="18" r="9" fill="url(#bearGrad)"/>
  <circle cx="16" cy="18" r="5" fill="url(#earInner)"/>
  <!-- Right Ear -->
  <circle cx="48" cy="18" r="9" fill="url(#bearGrad)"/>
  <circle cx="48" cy="18" r="5" fill="url(#earInner)"/>
  <!-- Head -->
  <circle cx="32" cy="30" r="19" fill="url(#bearGrad)"/>
  <!-- Snout -->
  <ellipse cx="32" cy="34" rx="9" ry="7" fill="#FFF2DF"/>
  <!-- Nose -->
  <path d="M29 32 Q32 30 35 32 Q33.5 35 32 35 Q30.5 35 29 32 Z" fill="#4A2818"/>
  <!-- Mouth -->
  <path d="M32 35 L32 37 M30 37 Q32 39 34 37" stroke="#4A2818" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- Eyes -->
  <circle cx="25" cy="27" r="2.5" fill="#2B150A"/>
  <circle cx="26" cy="26" r="0.9" fill="#FFFFFF"/>
  <circle cx="39" cy="27" r="2.5" fill="#2B150A"/>
  <circle cx="40" cy="26" r="0.9" fill="#FFFFFF"/>
  <!-- Blushing Cheeks -->
  <circle cx="22" cy="32" r="3.2" fill="#FF8BA7" opacity="0.6"/>
  <circle cx="42" cy="32" r="3.2" fill="#FF8BA7" opacity="0.6"/>
  <!-- Heart Held -->
  <path d="M32 46 C24 38 18 43 18 48 C18 53 23 57 32 62 C41 57 46 53 46 48 C46 43 40 38 32 46 Z" fill="#FF4F87"/>
</svg>
